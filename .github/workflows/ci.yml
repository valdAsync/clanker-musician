name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go vet ./...
      - run: go test -race ./... # the audio device test skips on runners without sound
      - run: node --test --experimental-strip-types pi/clanker/*.test.ts
      - name: Cross-compile every release target
        run: node --experimental-strip-types scripts/npm-build.mjs
